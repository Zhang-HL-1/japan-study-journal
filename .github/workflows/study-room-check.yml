name: Study room checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/study-room]
    paths:
      - '*.html'
      - 'study-navigation*'
      - 'school-hub*'
      - 'study-desk*'
      - 'scripts/build-school-index.cjs'
      - 'exam-scope*'
      - 'practice.html'
      - 'drill.html'
      - 'past-papers*'
      - 'study-room.css'
      - 'styles.css'
      - 'editorial.css'
      - 'script.js'
      - 'campus-map-data.js'
      - 'questions.js'
      - 'paper-practice-data.js'
      - 'scripts/build-paper-practice.cjs'
      - 'practice.css'
      - 'practice*.js'
      - 'assets/past-papers*'
      - 'assets/drill-practice*'
      - 'tests/**'
      - '.github/workflows/study-room-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Catalog and interaction unit checks
        run: |
          node scripts/build-school-index.cjs --check
          node scripts/build-paper-practice.cjs --check
          node --test --test-reporter=dot tests/*.test.cjs
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix .qa playwright@1.55.1 --ignore-scripts --no-audit --no-fund
          node .qa/node_modules/playwright/cli.js install --with-deps chromium
      - name: Desktop and mobile browser checks
        env:
          NODE_PATH: .qa/node_modules
          STUDY_ROOM_SCREENSHOTS: review
        run: |
          node tests/paper-practice.browser.cjs
          node tests/study-room.browser.cjs
          node tests/navigation.browser.cjs
          node tests/school-hub.browser.cjs
          node tests/study-desk.browser.cjs
      - name: Save desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-room-review
          path: review/
          if-no-files-found: ignore
          retention-days: 5
