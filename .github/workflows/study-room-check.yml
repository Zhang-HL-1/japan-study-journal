name: Study room checks

on:
  push:
    branches: [main, codex/study-room]
    paths:
      - 'practice.html'
      - 'drill.html'
      - 'past-papers*'
      - 'study-room.css'
      - 'styles.css'
      - 'editorial.css'
      - 'script.js'
      - 'campus-map-data.js'
      - 'questions.js'
      - 'practice*.js'
      - 'assets/past-papers*'
      - 'assets/drill-practice*'
      - 'tests/**'
      - '.github/workflows/study-room-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Catalog and interaction unit checks
        run: node --test --test-reporter=dot tests/*.test.cjs
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix .qa playwright@1.55.1 --ignore-scripts --no-audit --no-fund
          node .qa/node_modules/playwright/cli.js install --with-deps chromium
      - name: Desktop and mobile browser checks
        env:
          NODE_PATH: .qa/node_modules
          STUDY_ROOM_SCREENSHOTS: review
        run: node tests/study-room.browser.cjs
      - name: Save desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-room-review
          path: review/
          if-no-files-found: ignore
          retention-days: 5
