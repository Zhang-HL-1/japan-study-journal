<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>选题练习 · 留日手记</title>
<link rel="stylesheet" href="question-practice.css?v=20261028-flow"><link rel="stylesheet" href="question-hub.css?v=20261028-flow">
<script src="question-bank.js?v=20261024-collections" defer></script><script src="question-flow.js?v=20261028-flow" defer></script><script src="question-hub.js?v=20261028-flow" defer></script>
</head>
<body>
<a class="skip" href="#results">跳到题单</a>
<header class="site-top"><a class="brand" href="index.html"><i></i>留日手记</a><nav aria-label="页面导航"><a href="practice.html">练习室</a><a href="drill.html">整卷练习</a><a href="past-papers.html">过去问</a></nav></header>
<main>
<div class="intro"><div><p class="eyebrow">QUESTION PRACTICE · 逐题练习</p><h1>选好范围，<em>一道道练。</em></h1><p>跨学校、跨年份组成题单。保留每道题的原题、出处与共用条件。</p></div></div>
<section class="hub-filters" aria-label="筛选题目">
<label>学校<select id="school"><option value="">全部学校 · 跨校练习</option></select></label>
<label>研究科／专攻<select id="major"><option value="">全部专攻</option></select></label>
<label>年份<select id="year"><option value="">全部年份</option></select></label>
<label>科目<select id="subject"><option value="">全部科目</option></select></label>
<label>练习状态<select id="scope"><option value="all">全部题目</option><option value="unanswered">未练习</option><option value="bookmarked">已收藏</option></select></label>
<label>搜索<input id="search" type="search" placeholder="题目、知识点或出处" maxlength="100"></label>
<button id="reset" type="button">重置筛选</button>
</section>
<section id="results" aria-label="筛选结果" tabindex="-1">
<div class="hub-actions"><p id="result-count" role="status">正在加载题目…</p><div><label for="order">顺序</label> <select id="order"><option value="year">年份由新到旧</option><option value="random">随机练习</option></select> <button id="start" class="primary" disabled>开始练习 →</button></div></div>
<p id="hub-message" role="status"></p><ol id="question-results" class="hub-results"></ol><button id="more" hidden>显示更多题目</button>
</section>
<noscript><p>请启用 JavaScript，或前往<a href="past-papers.html">过去问</a>阅读原卷。</p></noscript>
</main>
<footer>留日手记 <span>从原题出发，把每一步练扎实。</span></footer>
</body></html>
